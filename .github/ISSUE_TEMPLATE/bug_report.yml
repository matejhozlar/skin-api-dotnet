name: Bug report
description: Something in the .NET client behaves incorrectly
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A couple of notes first:

        - This is the **client library**. If the API returns a wrong or missing
          image for a valid request (rendering, a pose looking off), that is a
          service issue, not an SDK bug, and belongs upstream.
        - Never paste your API key, bearer token, or other secrets here.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: The `Createrington.SkinApi` NuGet package version.
      placeholder: "1.2.1"
    validations:
      required: true
  - type: input
    id: target-framework
    attributes:
      label: Target framework
      description: The .NET target you build against.
      placeholder: "net8.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, Ubuntu 24.04, ..."
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you call, and what went wrong?
      placeholder: |
        RenderAsync("wave", SkinSource.FromUuid("...")) threw instead of returning bytes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: A small snippet that reproduces it. Redact your API key.
      render: csharp
    validations:
      required: false
  - type: textarea
    id: exception
    attributes:
      label: Exception details
      description: >
        If a SkinApiException was thrown, include its Code, Status, and
        RetryAfterMs, plus the stack trace.
    validations:
      required: false
